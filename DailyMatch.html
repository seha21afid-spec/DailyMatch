// --- MAIN APP ---
function DailyMatchApp() {
  const [currentView, setCurrentView] = useState('onboarding');
  const [profile, setProfile] = useState(null);

  useEffect(() => {
    try {
      const saved = localStorage.getItem('dailyMatchProfile');
      if (saved) {
        setProfile(JSON.parse(saved));
        setCurrentView('home');
      }
    } catch (e) { console.error(e); }
  }, []);

  const saveProfile = (p) => {
    setProfile(p);
    try { localStorage.setItem('dailyMatchProfile', JSON.stringify(p)); } catch (e) {}
    setCurrentView('home');
  };

  return (
    <div className="min-h-screen bg-slate-200 flex justify-center font-sans text-slate-900 selection:bg-orange-200">
      <div className="app-shell w-full max-w-md bg-slate-50 relative flex flex-col overflow-hidden shadow-2xl">
        {currentView === 'onboarding' && <OnboardingView onComplete={saveProfile} />}

        {currentView !== 'onboarding' && profile && (
          <>
            <header className="sticky top-0 z-30 bg-gradient-to-r from-orange-500 to-rose-500 text-white px-4 pt-4 pb-3 shadow-md">
              <div className="flex items-center justify-between gap-2 mb-3">
                <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setCurrentView('home')}>
                  <div className="w-9 h-9 bg-white text-orange-500 rounded-xl flex items-center justify-center font-black text-sm shadow">DM</div>
                  <div>
                    <p className="text-[11px] text-orange-100 font-medium leading-none mb-1">Halo, {profile.name}!</p>
                    <h1 className="text-sm font-extrabold tracking-tight leading-tight">DAILY MATCH</h1>
                  </div>
                </div>
                <button onClick={() => setCurrentView('profile')} className="w-9 h-9 bg-white/20 hover:bg-white/30 rounded-xl flex items-center justify-center transition">
                  <UserCog size={18} />
                </button>
              </div>
              <div className="relative">
                <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={14} />
                <input
                  type="text"
                  onFocus={() => setCurrentView('library')}
                  placeholder="Cari warna (Sage, Burgundy)..."
                  className="w-full pl-8 pr-3 py-2 bg-white text-slate-800 placeholder-slate-400 rounded-xl text-xs font-medium focus:outline-none shadow-inner"
                  style={{ fontSize: 16 }}
                />
              </div>
            </header>

            <main className="flex-1 overflow-y-auto pb-24 no-scrollbar relative">
              {currentView === 'home' && <HomeView profile={profile} onNavigate={setCurrentView} />}

function ColorStudioView({ profile }) {
  const [selectedColor, setSelectedColor] = useState(COLOR_DATABASE[0]);
  const [focus, setFocus] = useState('bottom');
  const [matches, setMatches] = useState([]);
  const [activeMatchIndex, setActiveMatchIndex] = useState(0);
  const [zoom, setZoom] = useState(1);
  const hijabMode = profile.hasHijab && profile.gender === 'female';

  useEffect(() => {
    const generated = [];
    const monoBase = COLOR_DATABASE.filter(c => c.category === selectedColor.category && c.id !== selectedColor.id)[0] || getRandomNeutral();
    const compBase = COLOR_DATABASE.filter(c => c.type !== selectedColor.type && c.type !== 'neutral')[0] || getRandomNeutral();

    for (let i = 1; i <= 15; i++) {
      let top = getRandomNeutral();
      let bottom = getRandomNeutral();
      let hijab = hijabMode ? getRandomNeutral() : undefined;

      if (focus === 'bottom') {
        bottom = selectedColor;
        top = i % 3 === 0 ? monoBase : i % 2 === 0 ? compBase : getRandomNeutral();
        if (hijab) hijab = i % 4 === 0 ? top : getRandomNeutral();
      } else if (focus === 'top') {
        top = selectedColor;
        bottom = i % 3 === 0 ? monoBase : i % 2 === 0 ? compBase : getRandomNeutral();
        if (hijab) hijab = i % 4 === 0 ? bottom : getRandomNeutral();
      } else if (focus === 'hijab' && hijabMode) {
        hijab = selectedColor;
        top = i % 2 === 0 ? monoBase : getRandomNeutral();
        bottom = i % 3 === 0 ? top : getRandomNeutral();
      }

      generated.push({
        id: `match-${i}`,
        rule: i === 1 ? 'Monochromatic Elegance' : i === 2 ? 'Complementary Bold' : 'Harmonious Casual',
        top, bottom, hijab,
        description: `Paduan warna ${top.name} dan ${bottom.name} memberikan kesan gaya dan seimbang.`,
      });
    }
    setMatches(generated);
    setActiveMatchIndex(0);
  }, [selectedColor, focus, profile.hasHijab, profile.gender]);

  const activeMatch = matches[activeMatchIndex];
  const focusBtn = (key, label) => (
    <button onClick={() => setFocus(key)}
      className={`flex-1 py-2 text-xs font-bold rounded-xl border transition ${focus === key ? 'border-orange-500 bg-orange-50 text-orange-600' : 'border-slate-200 bg-white text-slate-600'}`}>
      {label}
    </button>
  );

  return (
    <div className="flex flex-col h-full bg-slate-50 relative">
      <div className="h-[48%] bg-gradient-to-br from-slate-200 to-slate-300 relative border-b border-slate-300/50 overflow-hidden">
        <div className="absolute top-4 right-4 z-20 flex flex-col gap-2 bg-white/80 backdrop-blur-sm p-1.5 rounded-xl shadow-sm border border-white">
          <button onClick={() => setZoom(z => Math.min(Number((z + 0.2).toFixed(1)), 2))}
            className="w-7 h-7 flex items-center justify-center bg-white rounded-lg text-slate-700 hover:bg-orange-50 hover:text-orange-500 shadow-sm transition font-bold text-lg leading-none">+</button>
          <button onClick={() => setZoom(z => Math.max(Number((z - 0.2).toFixed(1)), 0.8))}
            className="w-7 h-7 flex items-center justify-center bg-white rounded-lg text-slate-700 hover:bg-orange-50 hover:text-orange-500 shadow-sm transition font-bold text-lg leading-none">-</button>
        </div>
        <StylizedAvatar profile={profile}
          topColor={activeMatch?.top.hex || '#FFFFFF'}
          bottomColor={activeMatch?.bottom.hex || '#1E293B'}
          hijabColor={activeMatch?.hijab?.hex || '#E6E6FA'}
          scale={zoom} />
      </div>

      <div className="flex-1 bg-white p-5 rounded-t-3xl -mt-5 z-10 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] overflow-y-auto">
        <div className="flex items-center justify-between mb-3">
          <div>
            <h3 className="font-black text-lg text-slate-800">Match Generator</h3>
            {activeMatch && <p className="text-[11px] text-slate-500">{activeMatch.rule}</p>}
          </div>
          <span className="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-xs font-bold shadow-inner">
            {activeMatchIndex + 1} / {matches.length}
          </span>
        </div>

        <div className="grid grid-cols-2 gap-3 mb-4">
          <button onClick={() => setActiveMatchIndex(prev => (prev > 0 ? prev - 1 : matches.length - 1))}
            className="py-3 bg-slate-100 rounded-xl font-bold text-sm text-slate-700 active:scale-95 transition">Prev Match</button>
          <button onClick={() => setActiveMatchIndex(prev => (prev < matches.length - 1 ? prev + 1 : 0))}
            className="py-3 bg-orange-500 rounded-xl font-bold text-sm text-white shadow-lg active:scale-95 transition">Next Match</button>
        </div>

        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-5">
          <div className="flex items-center justify-between mb-3">
            <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider">Target Warna Utama</h4>
            <span className="text-[11px] font-bold text-orange-600">{selectedColor.name}</span>
          </div>
          <div className="flex gap-2 mb-4">
            {focusBtn('top', 'Atasan')}
            {focusBtn('bottom', 'Bawahan')}
            {hijabMode && focusBtn('hijab', 'Hijab')}
          </div>
          <div className="flex overflow-x-auto gap-2.5 pb-2 no-scrollbar">
            {COLOR_DATABASE.map(c => (
              <button key={c.id} onClick={() => setSelectedColor(c)}
                className={`flex-shrink-0 w-11 h-11 rounded-full border-2 transition ${selectedColor.id === c.id ? 'border-orange-500 scale-110 shadow-md' : 'border-white shadow-sm'}`}
                style={{ backgroundColor: c.hex }} title={c.name} />
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

          <div className="grid grid-cols-3 gap-2">
            {charBtn('Cewek Hijab', 'female', true, editProfile.gender === 'female' && editProfile.hasHijab, 'border-orange-500 bg-orange-50 text-orange-600')}
            {charBtn('Cewek Non-Hijab', 'female', false, editProfile.gender === 'female' && !editProfile.hasHijab, 'border-pink-500 bg-pink-50 text-pink-600')}
            {charBtn('Laki-laki', 'male', false, editProfile.gender === 'male', 'border-blue-500 bg-blue-50 text-blue-600')}
          </div>
        </div>

        <div>
          <label className="text-xs font-bold text-slate-700 block mb-2">Tone Warna Kulit</label>
          <div className="grid grid-cols-5 gap-2">
            {SKIN_TONES.map(tone => {
              const isSelected = editProfile.skinTone === tone.id;
              return (
                <button key={tone.id} type="button" onClick={() => setEditProfile({ ...editProfile, skinTone: tone.id })}
                  className={`flex flex-col items-center gap-1.5 p-2 rounded-xl border-2 transition ${isSelected ? 'border-orange-500 bg-orange-50 shadow-sm' : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                  <div className="w-7 h-7 rounded-full shadow-inner border border-black/10" style={{ backgroundColor: tone.hex }} />
                  <span className={`text-[10px] font-bold ${isSelected ? 'text-orange-600' : 'text-slate-600'}`}>{tone.label}</span>
                </button>
              );
            })}
          </div>
        </div>

        <div>
          <label className="text-xs font-bold text-slate-700 block mb-1.5">Undertone Kulit</label>
          <div className="grid grid-cols-3 gap-2">
            {['Warm', 'Cool', 'Neutral'].map(u => {
              const isSelected = editProfile.undertone === u;
              return (
                <button key={u} type="button" onClick={() => setEditProfile({ ...editProfile, undertone: u })}
                  className={`py-2.5 px-3 rounded-xl border text-xs font-bold transition ${isSelected ? 'border-orange-500 bg-orange-50 text-orange-600 shadow-sm' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}`}>
                  {u}
                </button>
              );
            })}
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-xs font-bold text-slate-700 block mb-1.5">Tinggi (cm)</label>
            <input type="number" value={editProfile.height} onChange={e => setEditProfile({ ...editProfile, height: Number(e.target.value) })}
              className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:border-orange-500" style={{ fontSize: 16 }} />
          </div>
          <div>
            <label className="text-xs font-bold text-slate-700 block mb-1.5">Berat (kg)</label>
            <input type="number" value={editProfile.weight} onChange={e => setEditProfile({ ...editProfile, weight: Number(e.target.value) })}
              className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:border-orange-500" style={{ fontSize: 16 }} />
          </div>
        </div>

        <button onClick={() => onSave(editProfile)}
          className="w-full py-3 mt-4 bg-slate-900 text-white font-bold rounded-xl shadow-md hover:bg-slate-800 transition flex items-center justify-center gap-2">
          <Check size={16} /> Simpan Perubahan
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DailyMatchApp />);
</script>
</body>
</html>
